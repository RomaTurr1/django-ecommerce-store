{% extends "main/base.html" %}

{% block content %}
    <!-- Форма фильтрации -->
    <form method="get" class="category-form">
        <input type="text" id="searchInput" name="text" value="{{ search_text }}">
        <button type="submit">Поиск</button>
        <select name="category" class="category-select" onchange="this.form.submit()">
            <option value="all">Все категории</option>
            {% for category in categories %}
                <option value="{{ category.slug }}" {% if category_select == category.slug %}selected{% endif %}>
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>
    </form>

    <!-- Список продуктов -->
    <div class="products-grid">
        {% for product in products %}
            <div class="product-card">
                <!-- Здесь можно добавить вывод изображения, если оно есть -->
                <div style="padding: 20px;">
                    {% if product.image %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}">
                    {% else %}
                        <p>Изображения нет</p>
                    {% endif %}
                    <h3>{{ product.name }}</h3>
                    <p style="color: #ff6b6b; font-weight: bold; margin-top: 10px;">{{ product.price }} руб.</p>
                    <a href="{% url 'product_detail' product.id product.slug %}">Подробнее</a>
                    <form action="{% url 'add_cart' product.id %}" method="post">
                        {% csrf_token %}
                        <button type="submit">
                            В корзину
                        </button>
                    </form>
                </div>
            </div>
        {% empty %}
            <p>Товары не найдены.</p>
        {% endfor %}
    </div>
{% endblock %}
